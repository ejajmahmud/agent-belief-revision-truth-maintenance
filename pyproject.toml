[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-belief-revision-truth-maintenance"
version = "0.1.0"
description = "Doyle/McAllester-style Truth Maintenance System (TMS) retracting derived assertions when foundational premises are invalidated"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-belief-revision-truth-maintenance = "agent_belief_revision_truth_maintenance.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_belief_revision_truth_maintenance*"]
